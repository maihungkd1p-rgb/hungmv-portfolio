<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mai Văn Hưng — CV Quản Lý Kinh Doanh Khu Vực (Bản Gốc PDF)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #1e293b;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            height: 54px;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid #334155;
            flex-shrink: 0;
            z-index: 10;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 700;
        }
        .badge {
            background: #0284c7;
            color: #ffffff;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 0.84rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }
        .btn-back {
            background: #334155;
            color: #ffffff;
        }
        .btn-back:hover {
            background: #475569;
        }
        .btn-download {
            background: #0284c7;
            color: #ffffff;
        }
        .btn-download:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }
        .pdf-viewer-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 54px);
            background: #334155;
            position: relative;
        }
        iframe, object, embed {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .pdf-fallback {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .pdf-fallback h3 {
            margin-bottom: 10px;
            font-size: 1.2rem;
        }
        .pdf-fallback p {
            color: #94a3b8;
            margin-bottom: 16px;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar">
        <div class="topbar-left">
            <span class="badge">Bản Gốc PDF</span>
            <span>MAI VĂN HƯNG — QUẢN LÝ KINH DOANH KHU VỰC</span>
        </div>
        <div class="topbar-actions">
            <a href="index.html" class="btn btn-back">
                <span>←</span>
                <span>Quay Lại Portfolio</span>
            </a>
            <a href="assets/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" target="_blank" download="Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" class="btn btn-download">
                <span>⬇</span>
                <span>Tải File PDF Gốc</span>
            </a>
        </div>
    </header>

    <!-- NATIVE FULLSCREEN PDF VIEWER -->
    <main class="pdf-viewer-container">
        <object data="assets/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" type="application/pdf" width="100%" height="100%">
            <iframe src="assets/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" type="application/pdf">
                <div class="pdf-fallback">
                    <h3>📄 Hồ Sơ CV Gốc — Mai Văn Hưng</h3>
                    <p>Trình duyệt của bạn đang bật chế độ bảo mật hoặc không hỗ trợ đọc trực tiếp trong khung.</p>
                    <a href="assets/Quan_Ly_Khu_Vuc_Mai_Van_Hung.pdf" target="_blank" class="btn btn-download">
                        <span>↗ Mở Trực Tiếp Trên Tab Mới</span>
                    </a>
                </div>
            </iframe>
        </object>
    </main>

</body>
</html>
